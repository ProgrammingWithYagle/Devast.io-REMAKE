<!doctype html><html lang="en"><head><meta charset="utf-8"><base href="/"><title>Local audio acceptance</title><style>body{background:#203a2b;color:#e8e2c7;font:16px system-ui;padding:32px;max-width:900px}button{font:inherit;padding:12px;background:#dbc475;border:0;border-radius:6px}li{margin:8px 0}p{color:#b8cab2}</style></head><body><h1>Local audio acceptance</h1><p>Development-only checks using the real audio system and local media. Tests music/effects playback, pause, resume, volume and Geiger feedback.</p><button id="run">Run playback checks</button><ol id="results"></ol><p id="summary" role="status"></p><script type="module">
import {AudioSystem,defaultSettings} from '/src/presentation/audio.ts';
const OriginalAudio=window.Audio,voices=[];
window.Audio=class ObservedAudio extends OriginalAudio{constructor(src){super(src);voices.push(this);}play(){const result=super.play();result.catch(error=>this.dataset.playError=error.message);return result;}};
const results=document.querySelector('#results'),summary=document.querySelector('#summary');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const ready=voice=>new Promise((resolve,reject)=>{if(voice.readyState>=2)return resolve();voice.addEventListener('loadeddata',resolve,{once:true});voice.addEventListener('error',()=>reject(Error('Media decode failed: '+voice.src)),{once:true});setTimeout(()=>reject(Error('Media load timeout')),10000);});
document.querySelector('#run').addEventListener('click',async()=>{document.querySelector('#run').disabled=true;results.replaceChildren();summary.textContent='Checking local audio…';let audio;let checks=0;
 const check=(ok,label)=>{const li=document.createElement('li');li.textContent=(ok?'PASS · ':'FAIL · ')+label;results.append(li);if(!ok)throw Error(label);checks++;};
 try{audio=new AudioSystem({...defaultSettings,music:.12,effects:.2,ui:.2});audio.start();audio.effect('9mm-shot');await Promise.all(voices.map(ready));await wait(300);const music=voices[0];check(!music.paused&&music.currentTime>0,'Music decodes and advances after a user gesture');check(voices.some(v=>v.src.includes('9mm-shot')&&v.readyState>=2),'Action effect decodes from the local asset');check(voices.some(v=>v.src.includes('ambient8')&&v.loop&&!v.paused),'Ambient sound plays and loops alongside music');audio.pause(true);const at=music.currentTime,count=voices.length;audio.effect('9mm-shot');await wait(250);check(voices.every(v=>v.paused)&&music.currentTime===at,'Pause freezes music and stops effect voices');check(voices.length===count,'Paused effects do not create new voices');audio.pause(false);await wait(300);check(!music.paused&&music.currentTime>at,'Music resumes from its paused position');audio.update({...defaultSettings,music:.06,effects:.15,ui:.1});check(Math.abs(music.volume-.06)<.001,'Music volume changes immediately');audio.effect('button');check(Math.abs(voices.at(-1).volume-.1)<.001,'Interface sounds use their separate volume channel');audio.effect('9mm-shot',450);check(Math.abs(voices.at(-1).volume-.075)<.001,'Distant effects attenuate with distance');const before=voices.length;audio.radiation(100,5000);await ready(voices.at(-1));check(voices.length===before+1&&voices.at(-1).src.toLowerCase().includes('geiger'),'Radiation plays the local Geiger sound');summary.textContent=`PASS · ${checks} real-media checks; audio paused after review.`;}catch(error){summary.textContent='FAIL · '+error.message+' · '+JSON.stringify(voices.map(v=>({src:v.src.split('/').at(-1),paused:v.paused,time:v.currentTime,ready:v.readyState,error:v.dataset.playError})));}finally{audio?.pause(true);document.querySelector('#run').disabled=false;}
});
</script></body></html>
