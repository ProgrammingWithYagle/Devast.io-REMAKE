<!doctype html><html><head><meta charset="utf-8"><base href="/"><title>Populated world review</title><style>html,body{margin:0;overflow:hidden;font:14px system-ui;background:#20382c;color:#eee5c4}canvas{display:block}header{position:fixed;top:10px;left:10px;right:10px;padding:12px;border:1px solid #73866a;border-radius:7px;background:#15291ef5;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button{font:inherit;padding:8px;background:#dfce95;border:0;border-radius:4px}output{flex:1;min-width:300px}</style></head><body><canvas id="scene" aria-label="Populated base under attack"></canvas><header><b>Controlled late-game fixture</b><button id="run">Measure 30 seconds</button><button id="blast">Explosion frame</button><output id="result">Full generated world · 32 ghouls · 3 robots · operating stations · night lighting</output></header><script type="module">
import {Game} from '/src/core/game.ts';import {generateWorld} from '/src/world/generate.ts';import {Renderer} from '/src/presentation/renderer.ts';import {defaultSettings} from '/src/presentation/audio.ts';import {RECIPES} from '/src/content/index.ts';import {stack} from '/src/core/inventory.ts';
const renderer=new Renderer(document.querySelector('#scene'),{...defaultSettings,zoom:.65}),result=document.querySelector('#result');await renderer.load();let game;
function setup(){const w=generateWorld('populated-base','Controlled performance fixture');w.entities=w.entities.filter(e=>Math.hypot(e.x-2048,e.y-4608)>1050);w.player.x=2048;w.player.y=4608;w.time=550;w.player.age=5000;w.nextSpawn=1e8;game=new Game(w);game.player.equipped=stack(w,'tesla_armor');
 for(let x=-9;x<=9;x++)for(let y=-6;y<=6;y++){game.create('wood_floor',2048+x*64,4608+y*64,game.player.owner);if(Math.abs(x)===9||Math.abs(y)===6)game.create('metal_wall',2048+x*64,4608+y*64,game.player.owner);}
 ['workbench','research_bench','tesla_bench','weaving_machine','welding_machine','smelter','campfire','firepit','compost','agitator','extractor','feeder'].forEach((id,i)=>{const e=game.create(id,2048+(i%4-1.5)*240,4608+(Math.floor(i/4)-1)*200,game.player.owner);e.fuel=100;e.fuelLeft=1000;const r=Object.values(RECIPES).find(r=>r.station===id);if(r)e.jobs=Array.from({length:4},(_,j)=>({id:'perf-'+i+'-'+j,recipe:r.id,total:r.craft_seconds,remaining:r.craft_seconds,output:1,reserved:[]}));});
 for(let i=0;i<32;i++){const a=i*Math.PI/16;const e=game.create(['normal_ghoul','fast_ghoul','explosive_ghoul','radioactive_ghoul','armored_ghoul'][i%5],2048+Math.cos(a)*690,4608+Math.sin(a)*570);e.ai.mode='chase';e.ai.target='player';e.ai.lastSeen=w.time;}
 ['lapabot','hal_bot','tesla_bot'].forEach((id,i)=>{const e=game.create(id,1888+i*160,4508,game.player.owner);e.deployment=0;});
 for(let i=0;i<8;i++){const e=game.create('lamp',1600+i*128,4720,game.player.owner);e.signal=true;}
 renderer.fx=[];renderer.draw(game,performance.now());}
setup();window.addEventListener('resize',()=>{renderer.resize();renderer.draw(game,performance.now());});
document.querySelector('#run').addEventListener('click',async()=>{setup();const button=document.querySelector('#run');button.disabled=true;const samples=[];let ticks=0;try{for(let frame=0;frame<900;frame++){const start=performance.now();for(let n=0;n<2;n++){game.step({x:0,y:0,aim:0,attack:false,sprint:false});ticks++;}for(const e of game.events)renderer.event(e);game.events.length=0;renderer.draw(game,performance.now());samples.push(performance.now()-start);if(frame%1===0){result.textContent=`Measuring ${frame}/900 frames…`;await new Promise(r=>setTimeout(r,0));}if(game.player.dead)throw Error('Fixture died before the simulation completed');}samples.sort((a,b)=>a-b);result.textContent=`PASS · ${ticks} fixed ticks + 900 renders · ${game.world.entities.filter(e=>e.active).length} active entities · mean ${(samples.reduce((a,b)=>a+b,0)/samples.length).toFixed(1)} ms · p95 ${samples[855].toFixed(1)} ms · max ${samples.at(-1).toFixed(1)} ms`;}
catch(error){result.textContent='FAIL · '+error.message;}finally{button.disabled=false;}});
document.querySelector('#blast').addEventListener('click',()=>{setup();const e=game.create('c4',2240,4544,game.player.owner);game.destroy(e);for(const event of game.events)renderer.event(event);for(const fx of renderer.fx)if(fx.radius)fx.life=fx.total*.6;renderer.draw(game,performance.now());result.textContent='Actual C4 explosion event and damage feedback, frozen for inspection.';});
</script></body></html>
