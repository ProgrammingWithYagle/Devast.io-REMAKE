<!doctype html>
<html lang="en"><head><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World scene review</title><style>
html,body{margin:0;background:#46674e;font:14px system-ui;color:#efe8cf;overflow:hidden}canvas{display:block}.controls{position:fixed;top:10px;left:10px;right:10px;background:#15291eee;border:1px solid #719065;border-radius:8px;padding:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.controls small{width:100%;color:#bac8ac}select,button{font:inherit;color:#233224;background:#e1daba;padding:5px}input{vertical-align:middle}output{font-variant-numeric:tabular-nums}
</style></head><body><canvas id="scene" aria-label="Controlled game world scene"></canvas><div class="controls"><label>Scene <select id="choose"></select></label><label><input id="night" type="checkbox"> Night</label><label><input id="occlusion" type="checkbox" checked> Occlusion</label><label>Zoom <input id="zoom" type="range" min="0.35" max="1.6" step="0.05" value="0.65"><output id="zoom-value">0.65×</output></label><button id="sweep">Render whole map</button><output id="result" aria-live="polite"></output><small id="description">Controlled review with the actual game renderer. Development only; excluded from the build.</small></div>
<script type="module">
import {Renderer} from '/src/presentation/renderer.ts';
import {defaultSettings} from '/src/presentation/audio.ts';
import {Game} from '/src/core/game.ts';
import {blankWorld,placeBlueprint,generateWorld} from '/src/world/generate.ts';
import {HOUSES,CITY,CAVE} from '/src/world/blueprints.ts';
import {stack} from '/src/core/inventory.ts';
import {updateCircuits} from '/src/systems/circuits.ts';
import {ITEMS,RECIPES,GHOULS} from '/src/content/index.ts';
import {blocksActor} from '/src/world/entities.ts';
import {circleRect,entityRect,distance} from '/src/core/math.ts';
const canvas=document.querySelector('canvas'),settings={...defaultSettings,zoom:.65},renderer=new Renderer(canvas,settings),choose=document.querySelector('#choose');
const blueprints=[...HOUSES,...CITY,CAVE];
const options=[['stations','All placed stations'],['drops','Dropped materials'],['damage','Wall and door damage states'],['crops','Farming stages'],['actors','Ghouls and robots'],...blueprints.map(b=>[b.id,b.name])];
for(const [value,label] of options){const option=document.createElement('option');option.value=value;option.textContent=label;choose.append(option);}
let game,origin=performance.now(),sweeping=false;
function scene(){game=new Game(blankWorld('visual-'+choose.value,'Controlled visual fixture'));game.world.nextSpawn=1e8;game.player.x=game.player.y=4096;game.player.selected=-1;origin=performance.now();const b=blueprints.find(b=>b.id===choose.value);
 if(b){const width=Math.max(...b.rows.map(r=>r.length))*64,height=b.rows.length*64;placeBlueprint(game.world,b,56,56,b.id.startsWith('city'));game=new Game(game.world);const centre={x:56*64+width/2,y:56*64+height/2};const floor=game.world.entities.filter(e=>e.type.endsWith('_floor')&&!game.near(e,100).some(o=>blocksActor(o)&&(o.radius?distance(e,o)<o.radius+20:circleRect(e,20,entityRect(o))))).sort((a,b)=>distance(a,centre)-distance(b,centre))[0];game.player.x=floor?.x??centre.x;game.player.y=floor?.y??centre.y;}
 else if(choose.value==='stations'){const ids=['workbench','research_bench','tesla_bench','weaving_machine','welding_machine','smelter','campfire','firepit','compost','agitator','extractor','feeder'];for(let y=-4;y<=4;y++)for(let x=-8;x<=8;x++)game.create('wood_floor',4096+x*64,4096+y*64);ids.forEach((id,i)=>{const e=game.create(id,4096+(i%4-1.5)*245,4096+(Math.floor(i/4)-1)*180);e.fuel=12;e.fuelLeft=30;const recipe=Object.values(RECIPES).find(r=>r.station===id);if(recipe)e.jobs=[{id:'visual-job-'+i,recipe:recipe.id,total:recipe.craft_seconds,remaining:recipe.craft_seconds*.55,output:1,reserved:[]}];});game.player.y+=10;}
 else if(choose.value==='drops'){const ids=['wood','stone','iron','sulfur','uranium','string','leather','animal_tendon','animal_fat','shaped_metal','shaped_uranium','alloys','electronic_parts','energy_cells','big_wires','small_wire','orange_seed','tomato_seed','tree_seed','orange','tomato','raw_steak','cooked_steak','bandage','metal_axe','9mm','bullet','cartridge','heavy_bullet'];ids.forEach((id,i)=>game.drop(stack(game.world,id,2),{x:4096+(i%7-3)*85,y:4096+(Math.floor(i/7)-2)*85}));game.player.x-=42.5;}
 else if(choose.value==='damage'){['wood_wall','stone_wall','metal_wall','wood_door','stone_door','metal_door'].forEach((id,row)=>[1,.65,.4,.15].forEach((hp,col)=>{const e=game.create(id,4096+(col-1.5)*100,4096+(row-2.5)*95);e.hp=e.maxHp*hp;}));}
 else if(choose.value==='crops'){['orange_seed','tomato_seed','tree_seed'].forEach((id,row)=>[.1,.5,.95,1].forEach((age,col)=>{const e=game.create(id,4096+(col-1.5)*110,4096+(row-1)*110);e.growAt=age===1?0:100+(1-age)*(id==='tree_seed'?300:180);if(age===1){e.type=id==='tree_seed'?'tree':id.replace('_seed','_bush');e.kind=id==='tree_seed'?'resource':'crop';}}));game.player.y+=220;}
 else if(choose.value==='actors'){[...Object.keys(GHOULS),'lapabot','hal_bot','tesla_bot'].forEach((id,i)=>{const e=game.create(id,4096+(i%4-1.5)*140,4096+(Math.floor(i/4)-.5)*160);e.hp*=.8;});game.player.y+=220;}
 for(const e of game.world.entities)if(e.type==='switch')e.switchOn=true;
 for(let i=0;i<20;i++)updateCircuits(game,.1);
 document.querySelector('#description').textContent=`${choose.selectedOptions[0].textContent} · actual game renderer · controlled visual fixture, excluded from the packaged game`;
}
choose.addEventListener('change',scene);document.querySelector('#occlusion').addEventListener('change',e=>renderer.occlusion=e.target.checked);document.querySelector('#zoom').addEventListener('input',e=>{settings.zoom=Number(e.target.value);document.querySelector('#zoom-value').textContent=settings.zoom.toFixed(2)+'×';});window.addEventListener('resize',()=>renderer.resize());
document.querySelector('#sweep').addEventListener('click',async()=>{const result=document.querySelector('#result'),button=document.querySelector('#sweep'),oldZoom=settings.zoom;button.disabled=true;sweeping=true;const samples=[];let frames=0;try{const sweepWorld=new Game(generateWorld('render-sweep','Controlled map rendering sweep'));settings.zoom=.65;for(const time of [100,550])for(let y=0;y<=8192;y+=512){sweepWorld.player.y=y;sweepWorld.world.time=time;for(let x=0;x<=8192;x+=512){sweepWorld.player.x=x;const start=performance.now();renderer.draw(sweepWorld,start);samples.push(performance.now()-start);frames++;}result.textContent=`Rendering ${frames}/578 views…`;await new Promise(resolve=>setTimeout(resolve,0));}samples.sort((a,b)=>a-b);result.textContent=`PASS · ${frames} day/night views · ${sweepWorld.world.entities.length} entities · mean ${(samples.reduce((a,b)=>a+b,0)/samples.length).toFixed(1)} ms · p95 ${samples[Math.floor(samples.length*.95)].toFixed(1)} ms`;}catch(error){result.textContent=`FAIL after ${frames} views: ${error.message}`;}finally{settings.zoom=oldZoom;sweeping=false;button.disabled=false;}});
await renderer.load();scene();function frame(now){if(!sweeping){game.world.time=(document.querySelector('#night').checked?550:100)+(now-origin)/1000%30;renderer.draw(game,now);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
